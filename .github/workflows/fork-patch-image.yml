# Fork-only build. Runs the test suite, then publishes a single-arch (amd64)
# image to GHCR carrying this fork's patches on top of an upstream tag.
# Deliberately separate from upstream's release.yml, which bumps versions,
# pushes to Docker Hub and needs secrets this fork does not have.
name: Fork patched image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. 4.1.7-racefix)
        required: true
        default: patched

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test
        run: dotnet test tests/Sportarr.Api.Tests/Sportarr.Api.Tests.csproj -c Release

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy frontend to wwwroot
        run: |
          rm -rf src/wwwroot/assets src/wwwroot/index.html
          mkdir -p src/wwwroot/assets
          cp -r _output/UI/* src/wwwroot/

      - name: Publish binaries
        run: |
          dotnet publish src/Sportarr.csproj -c Release -r linux-x64 \
            --self-contained false -p:PublishSingleFile=false \
            -p:SkipFrontendBuild=true -o publish/docker-linux-x64
          # Dockerfile COPYs both arch dirs unconditionally; amd64-only build
          # still needs the arm64 path to exist.
          mkdir -p publish/docker-linux-arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: CACHEBUST=${{ github.run_id }}
          tags: ghcr.io/${{ github.repository_owner }}/sportarr:${{ inputs.tag }}
